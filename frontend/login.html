<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Login | Bourbon.Yard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="nav">
    <div class="logo">Bourbon.Yard</div>
    <nav class="menu">
    </nav>
  </div>
</header>

<!-- ===== LOGIN ===== -->
<main class="booking">
  <div class="booking-card">
    <h2>เข้าสู่ระบบ</h2>

    <form id="loginForm">
      <div class="form-group">
        <input
          type="email"
          id="email"
          placeholder="อีเมล"
          required
        >
      </div>

      <div class="form-group">
        <input
          type="password"
          id="password"
          placeholder="รหัสผ่าน"
          required
        >
      </div>

      <button type="submit" class="btn-primary full">
        เข้าสู่ระบบ
      </button>
    </form>

    <p style="text-align:center; margin-top:20px;">
      ยังไม่มีบัญชี?
      <a href="registration.html">สมัครสมาชิก</a>
    </p>
  </div>
</main>

<script src="/js/script.js"></script>
</body>
</html>
