<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book a Table | Bourbon.Yard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="nav">
    <div class="logo">Bourbon.Yard</div>
    <div class="menu">
      <a href="#promo">โปรโมชั่น</a>
      <a href="wine.html">Wine</a>
      <a href="booking.html" class="btn-primary">จองโต๊ะ</a>
      <a href="profile.html" class="btn-outline">โปรไฟล์</a>
      <button id="logout" class="btn-outline">Logout</button>
    </div>
  </div>
</header>

<!-- ===== BOOKING ===== -->
<section class="booking">
  <div class="booking-card">

    <h2>Reserve Your Table</h2>

    <div class="form-grid">
      <div class="form-group">
        <label>วันที่</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label>เวลา</label>
        <input type="time" id="time" min="17:00" max="23:00">
      </div>
    </div>

    <!-- ===== INDOOR ===== -->
    <div class="zone">
      <h4 class="zone-title">🍷 Indoor Zone</h4>
      <div class="table-grid indoor">
        <div class="table" data-table="1">1</div><div class="table" data-table="2">2</div>
        <div class="table" data-table="3">3</div><div class="table" data-table="4">4</div>
        <div class="table" data-table="5">5</div><div class="table" data-table="6">6</div>
        <div class="table" data-table="7">7</div><div class="table" data-table="8">8</div>
        <div class="table" data-table="9">9</div><div class="table" data-table="10">10</div>
        <div class="table" data-table="11">11</div><div class="table" data-table="12">12</div>
        <div class="table" data-table="13">13</div> <div class="table" data-table="14">14</div>
        <div class="table" data-table="15">15</div>
      </div>
    </div>

    <!-- ===== OUTDOOR ===== -->
    <div class="zone">
      <h4 class="zone-title">🌿 Outdoor Zone</h4>
      <div class="table-grid outdoor">
        <div class="table circle" data-table="16">16</div>
        <div class="table circle" data-table="17">17</div>
        <div class="table circle" data-table="18">18</div>
        <div class="table circle" data-table="19">19</div>
        <div class="table circle" data-table="20">20</div>
        <div class="table circle" data-table="21">21</div>
      </div>
    </div>

    <p id="bookingMessage"></p>

  </div>
</section>

<!-- ===== POPUP ===== -->
<div id="tablePopup" class="popup-overlay">
  <div class="popup-card">
    <h3>จองโต๊ะหมายเลข <span id="popupTableNo"></span></h3>

    <label>ชื่อผู้จอง</label>
      <input type="text" id="popupName" placeholder="ชื่อ">

      <label>เบอร์โทร</label>
      <input type="text" id="popupPhone" placeholder="เบอร์โทร">

      <label>จำนวนคน</label>
      <input type="number" id="popupPeople" min="1" value="1">

      <label>เวลา</label>
      <input type="time" id="popupTime" min="17:00" max="23:00">

    <div class="popup-actions">
      <button type="button" id="cancelTable">ยกเลิก</button>
      <button type="button" id="confirmTable">ยืนยันโต๊ะ</button>
    </div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
</div>

<div id="toast" class="toast"></div>

<footer class="footer">
  <p>© 2026 Bourbon.Yard Lampang</p>
</footer>

<script src="/js/script.js"></script>
</body>
</html>
