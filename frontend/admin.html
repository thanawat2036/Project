<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Bourbon.Yard | Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="header">
  <div class="nav">
    <div class="logo">Bourbon.Yard | Admin</div>
    <div class="menu">
      <span id="username"></span>
      <button id="logout" class="btn-outline">ออกจากระบบ</button>
    </div>
  </div>
</header>

<main class="container">

  <!-- ===== CLOSE / OPEN TABLE ===== -->
  <section class="card">
    <h2>จัดการโต๊ะ (ปิดทั้งวัน)</h2>

    <input type="date" id="closeDate">
    <input type="number" id="tableNo" placeholder="หมายเลขโต๊ะ">

    <button id="closeTableBtn">ปิดโต๊ะ</button>
    <button id="openTableBtn" class="btn-outline">เปิดโต๊ะ</button>
  </section>

  <!-- ===== BOOKINGS ===== -->
  <section class="card">
    <h2>การจองทั้งหมด</h2>
    <table>
      <thead>
        <tr>
          <th>วันที่</th>
          <th>เวลา</th>
          <th>โต๊ะ</th>
          <th>ผู้ใช้</th>
          <th>สถานะ</th>
        </tr>
      </thead>
      <tbody id="bookingTable"></tbody>
    </table>
  </section>

  <!-- ===== USERS ===== -->
  <section class="card">
    <h2>ผู้ใช้งาน</h2>
    <table>
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>Email</th>
          <th>Admin</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </section>

  <!-- ===== MESSAGES ===== -->
  <section class="card">
    <h2>ข้อความจากผู้ใช้</h2>
    <div id="messageList"></div>
  </section>

</main>

<script src="/js/admin.js"></script>
</body>
</html>
